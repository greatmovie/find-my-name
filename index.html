<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>내이름을찾아줘</title>
<meta name="description" content="지호를 위한 공룡 이름 맞추기 놀이">
<meta name="theme-color" content="#FF8A3D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="내이름을찾아줘">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./images/icon-192.png">
<link rel="icon" href="./images/icon-192.png">
<style>
  :root{
    --ink:#2B2118;
    --cream:#FFF6E4;
    --orange:#FF7A2F;
    --orange-d:#F2560F;
    --amber:#FFC144;
    --green:#2E9E5B;
    --green-d:#1F7A44;
    --red:#E4483C;
    --card-shadow:0 12px 28px rgba(120,62,0,.22), 0 3px 8px rgba(120,62,0,.14);
    --safe-t:env(safe-area-inset-top, 0px);
    --safe-b:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:radial-gradient(120% 90% at 50% -10%, #FFF9EC 0%, #FFEFD2 45%, #FFDFB8 100%);
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:manipulation;
    user-select:none; -webkit-user-select:none;
  }
  #app{position:fixed; inset:0; display:flex; flex-direction:column;}
  .screen{
    position:absolute; inset:0; display:flex; flex-direction:column;
    opacity:0; visibility:hidden; transform:scale(.98);
    transition:opacity .28s ease, transform .28s ease, visibility .28s;
    padding:calc(var(--safe-t) + 8px) 14px calc(var(--safe-b) + 10px);
  }
  .screen.active{opacity:1; visibility:visible; transform:none;}

  /* ---------- 시작 화면 ---------- */
  #screen-start{padding:0; overflow:hidden;
    background:radial-gradient(120% 80% at 50% 0%, #FFFCF3 0%, #FFF0D8 40%, #FFDDAF 100%);}
  .start-inner{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; padding:calc(var(--safe-t) + 14px) 20px calc(var(--safe-b) + 22px); gap:9px;
  }
  .start-text{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:9px; width:100%;
  }
  .brand{
    background:#fff; color:#8A5A22;
    font-weight:900; font-size:14px; letter-spacing:.02em;
    padding:8px 15px; border-radius:999px; box-shadow:0 4px 12px rgba(150,80,0,.14);
  }
  .hero-card{
    width:100%; aspect-ratio:3 / 2; border-radius:26px; overflow:hidden;
    border:6px solid #fff; box-shadow:0 14px 30px rgba(140,70,0,.26);
    background:#EAD9BC; margin-top:2px;
  }
  .hero-card img{width:100%; height:100%; object-fit:cover; object-position:46% 44%; display:block;}
  .title{
    margin:6px 0 0; color:#3A2410; font-weight:900; line-height:1.02; letter-spacing:-.03em;
    font-size:clamp(34px, 11.5vw, 52px); text-align:center;
  }
  .title span{display:block;}
  .title .em{color:var(--orange-d);}
  .subtitle{
    margin:2px 0 6px; color:#7A5A2E; font-weight:800; font-size:clamp(14px,4.2vw,18px); text-align:center;
  }
  .start-btn{
    border:0; width:100%; height:clamp(76px, 12vh, 92px); border-radius:26px;
    display:flex; align-items:center; justify-content:center; gap:12px;
    font-family:inherit; font-weight:900; color:#fff;
    font-size:clamp(26px, 7.6vw, 34px); letter-spacing:-.01em;
    background:linear-gradient(180deg,#FFB13D 0%, var(--orange) 52%, var(--orange-d) 100%);
    box-shadow:0 10px 0 #C43C05, 0 18px 30px rgba(150,55,0,.45);
    cursor:pointer; transition:transform .09s ease, box-shadow .09s ease;
    animation:btnBreath 2.4s ease-in-out infinite;
  }
  .start-btn:active{transform:translateY(6px); box-shadow:0 4px 0 #C43C05, 0 8px 16px rgba(150,55,0,.4);}
  .start-btn .ic{font-size:1.15em;}
  @keyframes btnBreath{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-3px) scale(1.015);}}
  .hint{color:#A28052; font-size:13px; font-weight:700; text-align:center; margin:0;}

  /* ---------- 퀴즈 화면 ---------- */
  #screen-quiz{
    background-image:radial-gradient(rgba(176,118,54,.12) 2px, transparent 2.2px);
    background-size:26px 26px;
    background-position:center top;
  }
  .topbar{display:flex; align-items:center; gap:10px; padding:2px 2px 8px;}
  .progress{flex:1; display:flex; align-items:center; gap:2px; justify-content:flex-start;}
  .paw{
    font-size:clamp(15px,4.4vw,20px); line-height:1; opacity:.28; transform:scale(.9);
    transition:opacity .25s ease, transform .25s ease, filter .25s ease;
    filter:grayscale(1);
  }
  .paw.done{opacity:1; filter:none; transform:scale(1.06);}
  .paw.now{opacity:.75; filter:none; animation:pawPulse 1.1s ease-in-out infinite;}
  @keyframes pawPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.25);}}
  .icon-btn{
    flex:0 0 auto; width:46px; height:46px; border-radius:50%; border:0;
    background:#fff; box-shadow:0 4px 10px rgba(120,62,0,.18);
    font-size:22px; line-height:1; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform .1s ease;
  }
  .icon-btn:active{transform:scale(.92);}
  .icon-btn.off{opacity:.55;}

  .stage{position:relative; flex:1 1 auto; min-height:0; display:flex; flex-direction:column;
    justify-content:center; gap:16px; padding-top:6px;}
  .photo-card{
    position:relative; flex:0 0 auto; width:100%; aspect-ratio:3 / 2;
    max-height:52vh;
    border-radius:28px; overflow:hidden;
    background:#E9D6B8;
    box-shadow:var(--card-shadow); border:5px solid #fff;
    display:flex; align-items:center; justify-content:center;
  }
  /* 배경: 같은 사진을 아주 흐리게 갈아 넣어 색감을 이어 준다 */
  .photo-card .photo-bg{
    position:absolute; inset:-10%; width:120%; height:120%; object-fit:cover;
    filter:blur(30px) brightness(.5) saturate(1.1); transform:scale(1.1);
    opacity:0; transition:opacity .4s ease; z-index:1;
  }
  .photo-card .photo-bg.ready{opacity:1;}
  /* 앞: 공룡 전신이 잘리지 않도록 그대로 보여준다 */
  .photo-card #dino-img{
    position:relative; z-index:2; width:100%; height:100%;
    object-fit:contain; display:block;
    opacity:0; transition:opacity .35s ease;
  }
  .photo-card #dino-img.ready{opacity:1;}
  .spinner{
    position:absolute; inset:0; margin:auto; width:54px; height:54px; border-radius:50%;
    border:6px solid rgba(255,255,255,.65); border-top-color:var(--orange);
    animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* 듣고 있어요 오버레이 */
  .listening{
    position:absolute; inset:0; z-index:5; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:radial-gradient(60% 60% at 50% 50%, rgba(20,10,0,.55), rgba(20,10,0,.78));
    backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
    border-radius:22px; text-align:center; padding:16px;
  }
  .listening.on{display:flex;}
  .listening .txt{color:#fff; font-weight:900; font-size:clamp(24px,7vw,32px); text-shadow:0 3px 10px rgba(0,0,0,.5);}
  .listening .heard{color:#FFE9B8; font-weight:800; font-size:14px; min-height:18px; margin-top:-6px;}
  .wave{display:flex; align-items:center; justify-content:center; gap:7px; height:70px;}
  .wave i{
    display:block; width:12px; height:22px; border-radius:8px;
    background:linear-gradient(180deg,#FFE07A,#FF8A3D);
    animation:bar 1s ease-in-out infinite;
    box-shadow:0 0 18px rgba(255,180,60,.8);
  }
  .wave i:nth-child(2){animation-delay:.12s;}
  .wave i:nth-child(3){animation-delay:.24s;}
  .wave i:nth-child(4){animation-delay:.36s;}
  .wave i:nth-child(5){animation-delay:.48s;}
  @keyframes bar{0%,100%{height:16px; opacity:.75;}50%{height:56px; opacity:1;}}
  .listen-ring{
    position:absolute; inset:0; margin:auto; width:210px; height:210px; border-radius:50%;
    border:3px solid rgba(255,214,120,.45);
    transform:scale(var(--lvl, 1)); transition:transform .08s linear;
    pointer-events:none;
  }
  .listen-ring.two{animation:ring 1.6s ease-out infinite;}
  @keyframes ring{0%{transform:scale(.7); opacity:.9;}100%{transform:scale(1.5); opacity:0;}}

  /* ---------- 하단 패널 ---------- */
  .panel{flex:0 0 auto; padding-top:4px;}
  .ask{display:flex; flex-direction:column; gap:10px;}
  .ask.hide{display:none;}
  .hint-q{
    margin:0; text-align:center; font-weight:900; font-size:clamp(15px,4.4vw,18px); color:#8A5A22;
    letter-spacing:-.01em;
  }
  .mic-btn{
    border:0; width:100%; height:clamp(78px,12vh,96px); border-radius:28px;
    display:flex; align-items:center; justify-content:center; gap:12px;
    font-family:inherit; font-weight:900; color:#fff; font-size:clamp(24px,7vw,31px); letter-spacing:-.01em;
    background:linear-gradient(180deg,#4CCB7B 0%, var(--green) 55%, var(--green-d) 100%);
    box-shadow:0 9px 0 #14603A, 0 16px 26px rgba(20,90,50,.38);
    cursor:pointer; position:relative; transition:transform .09s ease, box-shadow .09s ease;
  }
  .mic-btn:active{transform:translateY(6px); box-shadow:0 3px 0 #14603A, 0 8px 14px rgba(20,90,50,.35);}
  .mic-btn::after{
    content:""; position:absolute; inset:-8px; border-radius:34px;
    border:3px solid rgba(76,203,123,.45); animation:micPulse 1.8s ease-out infinite; pointer-events:none;
  }
  @keyframes micPulse{0%{transform:scale(.97); opacity:.85;}100%{transform:scale(1.06); opacity:0;}}
  .mic-btn.busy{filter:grayscale(.25) brightness(.95); pointer-events:none;}

  .answer{display:none; flex-direction:column; gap:8px; animation:pop .35s cubic-bezier(.2,1.5,.4,1);}
  .answer.on{display:flex;}
  @keyframes pop{0%{transform:scale(.86); opacity:0;}100%{transform:scale(1); opacity:1;}}
  .name-row{display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
  .diet{
    flex:0 0 auto; font-weight:900; font-size:14px; color:#fff; padding:7px 12px; border-radius:999px;
    white-space:nowrap;
  }
  .diet.carn{background:linear-gradient(180deg,#FF7E6B,#D8392B); box-shadow:0 3px 8px rgba(180,40,25,.3);}
  .diet.herb{background:linear-gradient(180deg,#6BD48B,#2E9E5B); box-shadow:0 3px 8px rgba(30,110,60,.3);}
  .diet.fly{background:linear-gradient(180deg,#7FC4FF,#2C82C9); box-shadow:0 3px 8px rgba(20,90,150,.3);}
  .diet.sea{background:linear-gradient(180deg,#4FC9C7,#12787E); box-shadow:0 3px 8px rgba(10,90,95,.3);}
  .dname{
    margin:0; font-weight:900; letter-spacing:-.02em; line-height:1.05;
    font-size:clamp(26px,7.6vw,36px); color:#3A2410;
  }
  .ddesc{
    margin:0; font-weight:800; font-size:clamp(14px,4.1vw,17px); line-height:1.38; color:#5A4326;
    word-break:keep-all;
  }
  .actions{display:flex; gap:9px; margin-top:2px;}
  .act{
    flex:1 1 0; border:0; border-radius:20px; padding:15px 6px; cursor:pointer;
    font-family:inherit; font-weight:900; font-size:clamp(15px,4.2vw,18px); color:#fff;
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition:transform .09s ease, box-shadow .09s ease;
  }
  .act:active{transform:translateY(4px);}
  .act.listen{background:linear-gradient(180deg,#7FC4FF,#2D8BE0); box-shadow:0 6px 0 #1B62A8;}
  .act.listen:active{box-shadow:0 2px 0 #1B62A8;}
  .act.next{background:linear-gradient(180deg,#FFB13D,var(--orange)); box-shadow:0 6px 0 #C43C05;}
  .act.next:active{box-shadow:0 2px 0 #C43C05;}

  /* ---------- 완료 화면 ---------- */
  #screen-done{align-items:center; justify-content:center; text-align:center; gap:12px;
    background:radial-gradient(100% 70% at 50% 20%, #FFF8E6, #FFE3BC);}
  .trophy{font-size:clamp(64px,20vw,96px); animation:bounce 1.6s ease-in-out infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-12px) rotate(3deg);}}
  .done-title{margin:0; font-weight:900; font-size:clamp(30px,9vw,42px); color:#3A2410; letter-spacing:-.02em; line-height:1.1;}
  .done-sub{margin:0; font-weight:800; font-size:clamp(15px,4.4vw,18px); color:#6B4E27;}
  .stars{display:flex; flex-wrap:wrap; justify-content:center; gap:6px; max-width:320px; margin:4px 0 6px;}
  .stars span{
    font-size:clamp(22px,6.4vw,28px); line-height:1; color:#FFB300;
    text-shadow:0 2px 0 #D98A00, 0 4px 8px rgba(160,90,0,.25);
    animation:starIn .4s backwards;
  }
  @keyframes starIn{from{transform:scale(0) rotate(-90deg); opacity:0;}to{transform:scale(1) rotate(0); opacity:1;}}
  .again-btn{
    border:0; margin-top:6px; width:min(360px,100%); height:clamp(72px,11vh,92px); border-radius:26px;
    font-family:inherit; font-weight:900; font-size:clamp(22px,6.4vw,28px); color:#fff;
    background:linear-gradient(180deg,#FFB13D 0%, var(--orange) 52%, var(--orange-d) 100%);
    box-shadow:0 9px 0 #C43C05, 0 16px 26px rgba(150,55,0,.4);
    display:flex; align-items:center; justify-content:center; gap:10px; cursor:pointer;
    transition:transform .09s ease, box-shadow .09s ease;
  }
  .again-btn:active{transform:translateY(6px); box-shadow:0 3px 0 #C43C05;}

  #confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:50;}

  /* ---------- 가로 화면 (PC·태블릿) ---------- */
  @media (min-aspect-ratio: 1/1){
    /* 시작 화면: 사진 | 글 두 단 */
    .start-inner{
      display:grid;
      grid-template-columns:minmax(0, auto) minmax(240px, 400px);
      grid-template-rows:auto auto;
      grid-template-areas:"photo brand" "photo text";
      justify-content:center; align-content:center; justify-items:start;
      gap:clamp(6px, 1.4vh, 16px) clamp(18px, 3vw, 48px);
      padding:calc(var(--safe-t) + 14px) clamp(20px, 4vw, 60px) calc(var(--safe-b) + 16px);
    }
    .brand{grid-area:brand; align-self:end; font-size:13px; padding:7px 13px;}
    .hero-card{
      grid-area:photo; align-self:center; justify-self:center;
      width:auto; height:min(70vh, 34vw); aspect-ratio:3 / 2;
      margin-top:0; border-width:5px; border-radius:22px;
    }
    .start-text{grid-area:text; align-self:start; align-items:flex-start; width:100%; gap:clamp(6px,1.2vh,12px);}
    .title{font-size:clamp(28px, 3.4vw, 54px); text-align:left; margin-top:2px;}
    .subtitle{font-size:clamp(13px, 1.4vw, 19px); text-align:left; margin:0;}
    .start-btn{width:100%; height:clamp(62px, 9vh, 88px); font-size:clamp(22px, 2.2vw, 31px);}
    .hint{font-size:12px; text-align:left;}

    /* 퀴즈 화면: 사진 | 문제·정답 두 단 */
    #screen-quiz .stage{
      flex-direction:row; align-items:center; justify-content:center;
      gap:clamp(14px, 2.2vw, 36px); padding-top:0;
    }
    #screen-quiz .photo-card{
      width:auto; height:min(76vh, 40vw); max-height:76vh; aspect-ratio:3 / 2;
      border-width:4px; border-radius:24px;
    }
    #screen-quiz .panel{padding-top:0; flex:1 1 auto; min-width:0; max-width:520px;}
    .hint-q{text-align:left; font-size:clamp(15px, 1.5vw, 20px);}
    .mic-btn{height:clamp(70px, 12vh, 92px); font-size:clamp(21px, 1.9vw, 28px);}
    .dname{font-size:clamp(24px, 2.6vw, 38px);}
    .ddesc{font-size:clamp(14px, 1.3vw, 17px);}

    /* 완료 화면 */
    .trophy{font-size:clamp(56px, 12vh, 92px);}
    .done-title{font-size:clamp(28px, 3.4vw, 44px);}
    .again-btn{height:clamp(64px, 10vh, 86px);}
  }

  @media (max-height:640px){
    .panel .ddesc{font-size:13px;}
    .mic-btn{height:70px;}
    .start-btn{height:70px;}
  }

  /* 아주 낮은 가로 화면(휴대폰 가로) */
  @media (min-aspect-ratio: 1/1) and (max-height: 480px){
    .start-inner{grid-template-columns:minmax(0, auto) minmax(200px, 44vw);}
    .hero-card{height:min(66vh, 26vw);}
  }
</style>
</head>
<body>
<div id="app">

  <!-- ===== 시작 화면 ===== -->
  <section class="screen active" id="screen-start">
    <div class="start-inner">
      <div class="brand">🦕 공룡 놀이</div>
      <div class="hero-card"><img src="images/tyrannosaurus.webp" alt="" decoding="async" fetchpriority="high"></div>
      <div class="start-text">
        <h1 class="title"><span>내 이름을</span><span class="em">찾아줘!</span></h1>
        <p class="subtitle">공룡을 보고 이름을 말해 봐요</p>
        <button class="start-btn" id="btn-start" type="button">
          <span class="ic">▶</span><span>놀자!</span>
        </button>
        <p class="hint">한 번에 열 마리씩, 놀 때마다 새 공룡이 나와요 🔊</p>
      </div>
    </div>
  </section>

  <!-- ===== 퀴즈 화면 ===== -->
  <section class="screen" id="screen-quiz">
    <div class="topbar">
      <div class="progress" id="progress" aria-hidden="true"></div>
      <button class="icon-btn" id="btn-sound" type="button" aria-label="소리 켜기/끄기">🔊</button>
    </div>

    <div class="stage">
      <div class="photo-card" id="photo-card">
        <img class="photo-bg" id="dino-bg" alt="" aria-hidden="true" decoding="async">
        <img id="dino-img" alt="공룡 사진" decoding="async">
        <div class="spinner" id="spinner"></div>
        <div class="listening" id="listening">
          <div class="listen-ring"></div>
          <div class="listen-ring two"></div>
          <div class="txt">듣고 있어요!</div>
          <div class="heard" id="heard"></div>
          <div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
        </div>
      </div>

      <div class="panel">
        <div class="ask" id="ask">
          <p class="hint-q">이 공룡의 이름은 뭘까요?</p>
          <button class="mic-btn" id="btn-mic" type="button">
            <span>🎤</span><span>정답 말하기!</span>
          </button>
        </div>

        <div class="answer" id="answer">
          <div class="name-row">
            <span class="diet carn" id="diet">🥩 육식</span>
            <h2 class="dname" id="dname">티라노사우루스</h2>
          </div>
          <p class="ddesc" id="ddesc"></p>
          <div class="actions">
            <button class="act listen" id="btn-again" type="button">🔊 다시 듣기</button>
            <button class="act next" id="btn-next" type="button">➡️ 다음 공룡</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== 완료 화면 ===== -->
  <section class="screen" id="screen-done">
    <div class="trophy">🏆</div>
    <h2 class="done-title">다 맞았어요!</h2>
    <p class="done-sub">공룡 박사님이 되었어요 🎉</p>
    <div class="stars" id="done-stars"></div>
    <button class="again-btn" id="btn-again-game" type="button">🔄 다시 놀기</button>
  </section>

</div>
<canvas id="confetti"></canvas>

<script>
(function () {
  "use strict";

  var DINOS = [
    {
      name: "티라노사우루스", diet: "육식", img: "images/tyrannosaurus.webp",
      desc: "큰 머리에 날카로운 이빨이 있어요. 육식 공룡 중에 가장 유명한 사냥꾼이에요!"
    },
    {
      name: "기가노토사우루스", diet: "육식", img: "images/giganotosaurus.webp",
      desc: "티라노만큼 몸집이 어마어마하게 큰 사냥꾼이에요. 긴 턱으로 먹이를 꽉 물었어요!"

  // 한 판에 내는 공룡 수 (전체 28종 중 매번 10마리를 뽑아 낸다)
  var ROUND = 10;

  /* ---------- 요소 ---------- */

  };

  /* ---------- 상태 ---------- */
  var state = {
    deck: [],
    pos: 0,
    muted: false,
    busy: false,
    revealed: false,
    started: false
  };

  var audio = {
    ctx: null,
    micStream: null,
    analyser: null,
    data: null,
    raf: 0,
    micGen: 0,
    unlocked: false
  };

  /* ---------- 소리 ---------- */
  function ensureCtx() {
    if (!audio.ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { audio.ctx = new AC(); } catch (e) { audio.ctx = null; }
    }
    if (audio.ctx && audio.ctx.state === "suspended") {
      audio.ctx.resume().catch(function () {});
    }
    return audio.ctx;
  }

  function tone(ctx, freq, startAt, dur, type, vol) {
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = type || "triangle";
    osc.frequency.setValueAtTime(freq, startAt);
    g.gain.setValueAtTime(0.0001, startAt);
    g.gain.exponentialRampToValueAtTime(vol || 0.22, startAt + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, startAt + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(startAt); osc.stop(startAt + dur + 0.05);
  }

  function playFanfare() {
    if (state.muted) return;
    var ctx = ensureCtx();
    if (!ctx) return;
    var t = ctx.currentTime + 0.02;
    // 밝은 딩동댕 멜로디
    var notes = [
      [523.25, 0.00, 0.16], // C5
      [659.25, 0.13, 0.16], // E5
      [783.99, 0.26, 0.16], // G5
      [1046.5, 0.39, 0.34], // C6
      [783.99, 0.62, 0.14], // G5
      [1046.5, 0.74, 0.42]  // C6
    ];
    for (var i = 0; i < notes.length; i++) {
      tone(ctx, notes[i][0], t + notes[i][1], notes[i][2], "triangle", 0.2);
      tone(ctx, notes[i][0] * 2, t + notes[i][1], notes[i][2] * 0.7, "sine", 0.06);
    }
  }

  function playPop() {
    if (state.muted) return;
    var ctx = ensureCtx();
    if (!ctx) return;
    var t = ctx.currentTime + 0.01;
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(520, t);
    osc.frequency.exponentialRampToValueAtTime(900, t + 0.09);
    g.gain.setValueAtTime(0.18, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.14);
  }

  /* ---------- 음성 (TTS) ---------- */
  var tts = { voice: null, primed: false };

  function pickVoice() {
    if (!window.speechSynthesis) return;
    var voices = window.speechSynthesis.getVoices() || [];
    var ko = null;
    for (var i = 0; i < voices.length; i++) {
      var v = voices[i];
      var lang = (v.lang || "").toLowerCase();
      if (lang.indexOf("ko") === 0) { ko = v; if (/female|yuna|sora|google/i.test(v.name || "")) break; }
    }
    tts.voice = ko;
  }

  if (window.speechSynthesis) {
    pickVoice();
    if (typeof window.speechSynthesis.addEventListener === "function") {
      window.speechSynthesis.addEventListener("voiceschanged", pickVoice);
    } else {
      window.speechSynthesis.onvoiceschanged = pickVoice;
    }
    setTimeout(pickVoice, 600);
  }

  function unlockAudio() {
    ensureCtx();
    if (tts.primed || !window.speechSynthesis) { tts.primed = true; return; }
    try {
      var u = new SpeechSynthesisUtterance(" ");
      u.volume = 0;
      u.lang = "ko-KR";
      window.speechSynthesis.speak(u);
      tts.primed = true;
    } catch (e) { /* 무시 */ }
  }

  function speak(text, force) {
    if (state.muted && !force) return;
    if (!window.speechSynthesis) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "ko-KR";
      if (tts.voice) u.voice = tts.voice;
      u.rate = 0.92;
      u.pitch = 1.08;
      u.volume = 1;
      window.speechSynthesis.speak(u);
    } catch (e) { /* 조용히 실패 */ }
  }

  function stopSpeech() {
    if (!window.speechSynthesis) return;
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }

  /* ---------- 마이크 (보조) ---------- */
  function startMicMeter() {
    if (audio.micStream || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    var gen = audio.micGen + 1;
    audio.micGen = gen;
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      // 기다리는 사이에 이미 정리되었으면 바로 끈다
      if (gen !== audio.micGen) {
        try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
        return;
      }
      audio.micStream = stream;
      var ctx = ensureCtx();
      if (!ctx) { stopMicMeter(); return; }
      try {
        var src = ctx.createMediaStreamSource(stream);
        var an = ctx.createAnalyser();
        an.fftSize = 512;
        src.connect(an);
        audio.analyser = an;
        audio.data = new Uint8Array(an.fftSize);
        meterLoop();
      } catch (e) { /* 무시 */ }
    }).catch(function () { /* 권한 없어도 그냥 진행 */ });
  }

  function meterLoop() {
    if (!audio.analyser) return;
    audio.analyser.getByteTimeDomainData(audio.data);
    var sum = 0;
    for (var i = 0; i < audio.data.length; i++) {
      var v = (audio.data[i] - 128) / 128;
      sum += v * v;
    }
    var rms = Math.sqrt(sum / audio.data.length);
    var lvl = 1 + Math.min(0.55, rms * 5);
    elRing.style.setProperty("--lvl", lvl.toFixed(3));
    audio.raf = requestAnimationFrame(meterLoop);
  }

  // 마이크 스트림과 미터기 정리 (표시등·배터리 계속 소모 방지)
  function stopMicMeter() {
    audio.micGen = audio.micGen + 1;
    if (audio.raf) { cancelAnimationFrame(audio.raf); audio.raf = 0; }
    if (audio.analyser) {
      try { audio.analyser.disconnect(); } catch (e) {}
      audio.analyser = null;
    }
    audio.data = null;
    if (audio.micStream) {
      try {
        var tracks = audio.micStream.getTracks();
        for (var i = 0; i < tracks.length; i++) { tracks[i].stop(); }
      } catch (e) {}
      audio.micStream = null;
    }
    elRing.style.setProperty("--lvl", "1");
  }

  var recognition = null;
  function startRecognition() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    try {
      recognition = new SR();
      recognition.lang = "ko-KR";
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;
      recognition.continuous = false;
      recognition.onresult = function (ev) {
        var txt = "";
        for (var i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
        elHeard.textContent = txt ? "“" + txt.trim() + "”" : "";
      };
      recognition.onerror = function () {};
      recognition.onend = function () { recognition = null; };
      recognition.start();
    } catch (e) { recognition = null; }
  }

  function stopRecognition() {
    if (!recognition) return;
    try { recognition.stop(); } catch (e) {}
    recognition = null;
  }

  // 화면을 떠날 때 마이크를 확실히 닫는다
  window.addEventListener("pagehide", function () { stopMicMeter(); stopRecognition(); });

  /* ---------- 화면 ---------- */
  function showScreen(key) {
    for (var k in screens) {
      if (Object.prototype.hasOwnProperty.call(screens, k)) {
        screens[k].classList.toggle("active", k === key);
      }
    }
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildProgress() {
    elProgress.innerHTML = "";
    for (var i = 0; i < TOTAL; i++) {
      var s = document.createElement("span");
      s.className = "paw";
      s.textContent = "🐾";
      elProgress.appendChild(s);
    }
  }

  function paintProgress() {
    var kids = elProgress.children;
    for (var i = 0; i < kids.length; i++) {
      kids[i].classList.toggle("done", i < state.pos);
      kids[i].classList.toggle("now", i === state.pos);
    }
  }

  function preloadWarm(count) {
    // 앞쪽 몇 장만 미리 받아 둔다 (모바일 데이터 절약)
    var n = Math.min(count || 3, state.deck.length);
    for (var i = 0; i < n; i++) {
      var im = new Image();
      im.src = state.deck[i].img;
    }
  }

  function showQuestion() {
    var dino = state.deck[state.pos];
    state.revealed = false;
    state.busy = false;

    elAsk.classList.remove("hide");
    elAnswer.classList.remove("on");
    elMic.classList.remove("busy");
    elListening.classList.remove("on");
    elHeard.textContent = "";
    elRing.style.setProperty("--lvl", "1");

    elImg.classList.remove("ready");
    elBg.classList.remove("ready");
    elSpinner.style.display = "block";
    elImg.alt = "공룡 사진";
    loadPhoto(dino.img);

    // 다음 이미지는 미리 받아 둔다
    var nextIdx = state.pos + 1;
    if (nextIdx < state.deck.length) {
      var pre = new Image();
      pre.src = state.deck[nextIdx].img;
    }

    paintProgress();
  }

  function loadPhoto(src) {
    elImg.onload = function () {
      fitCard();
      elImg.classList.add("ready");
      elSpinner.style.display = "none";
    };
    elImg.onerror = function () {
      elSpinner.style.display = "none";
    };
    elBg.onload = function () { elBg.classList.add("ready"); };
    elBg.src = src;
    elImg.src = src;
    if (elImg.complete && elImg.naturalWidth > 0) {
      fitCard();
      elImg.classList.add("ready");
      elSpinner.style.display = "none";
    }
  }

  // 사진 비율에 맞춰 카드 비율을 맞춘다 (잘림·검은 여백 없이 꽉 차게)
  function fitCard() {
    if (!elImg.naturalWidth || !elImg.naturalHeight) return;
    try {
      elPhotoCard.style.aspectRatio = elImg.naturalWidth + " / " + elImg.naturalHeight;
    } catch (e) { /* 구형 브라우저 */ }
  }

  /* ---------- 정답 말하기 ---------- */
  function startListening() {
    if (state.busy || state.revealed) return;
    state.busy = true;
    unlockAudio();
    playPop();
    if (navigator.vibrate) { try { navigator.vibrate(30); } catch (e) {} }

    elMic.classList.add("busy");
    elHeard.textContent = "";
    elListening.classList.add("on");

    startMicMeter();
    startRecognition();

    var finished = false;
    var finish = function () {
      if (finished) return;
      finished = true;
      doReveal();
    };
    // 마이크 권한/오류와 무관하게 3초 안에 반드시 넘어간다
    setTimeout(finish, LISTEN_MS);
  }

  function doReveal() {
    var dino = state.deck[state.pos];
    state.revealed = true;
    state.busy = false;

    stopRecognition();
    stopMicMeter();
    elListening.classList.remove("on");
    elRing.style.setProperty("--lvl", "1");

    elImg.alt = dino.name;

    var dietUi = DIET_UI[dino.diet] || DIET_UI["육식"];
    elDiet.className = "diet " + dietUi.cls;
    elDiet.textContent = dietUi.label;
    elName.textContent = dino.name;
    elDesc.textContent = dino.desc;

    elAsk.classList.add("hide");
    elAnswer.classList.add("on");

    fireConfetti();
    playFanfare();
    speak("정답은 " + dino.name + "! " + dino.desc);

    if (navigator.vibrate) { try { navigator.vibrate([40, 60, 40]); } catch (e) {} }
  }

  function replaySpeech() {
    if (state.muted) {
      state.muted = false;
      elSound.classList.remove("off");
      elSound.textContent = "🔊";
    }
    var dino = state.deck[state.pos];
    unlockAudio();
    speak("정답은 " + dino.name + "! " + dino.desc);
  }

  function goNext() {
    stopSpeech();
    if (state.pos >= state.deck.length - 1) {
      state.pos = state.deck.length;
      paintProgress();
      showDone();
      return;
    }
    state.pos += 1;
    showQuestion();
  }

  function showDone() {
    stopSpeech();
    elDoneStars.innerHTML = "";
    for (var i = 0; i < state.deck.length; i++) {
      var s = document.createElement("span");
      s.textContent = "★";
      s.style.animationDelay = (i * 70) + "ms";
      elDoneStars.appendChild(s);
    }
    showScreen("done");
    fireConfetti(220);
    playFanfare();
    speak("와! 공룡 열 마리를 다 맞혔어요. 정말 잘했어요!");
    // (TOTAL = 10 이라 '열 마리'로 읽어 준다)
  }

  // 28종 중 10마리를 새로 뽑는다 (바로 전 판과 똑같은 조합은 피한다)
  function drawDeck() {
    var prev = state.deck;
    for (var tryN = 0; tryN < 12; tryN++) {
      var pick = shuffle(DINOS).slice(0, TOTAL);
      if (prev.length !== pick.length || !sameSet(prev, pick)) return pick;
    }
    return shuffle(DINOS).slice(0, TOTAL);
  }

  function sameSet(a, b) {
    var key = function (list) {
      return list.map(function (d) { return d.img; }).sort().join("|");
    };
    return key(a) === key(b);
  }

  function startGame() {
    state.deck = drawDeck();
    state.pos = 0;
    state.revealed = false;
    state.busy = false;
    state.started = true;
    unlockAudio();
    buildProgress();
    showScreen("quiz");
    showQuestion();
    preloadWarm(3);
    speak("공룡 이름을 말해 봐요!");
  }

  /* ---------- 컨페티 ---------- */
  var canvas = document.getElementById("confetti");
  var ctx2d = canvas.getContext("2d");
  var pieces = [];
  var confettiRaf = 0;
  var COLORS = ["#FF6B3D", "#FFC144", "#4CCB7B", "#48A9F8", "#FF4E8B", "#FFE066", "#9B6BFF"];

  function resizeCanvas() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);

  function fireConfetti(count) {
    var n = count || 130;
    var w = window.innerWidth;
    var h = window.innerHeight;
    for (var i = 0; i < n; i++) {
      pieces.push({
        x: Math.random() * w,
        y: -20 - Math.random() * h * 0.35,
        vx: (Math.random() - 0.5) * 2.6,
        vy: 2 + Math.random() * 4.2,
        w: 6 + Math.random() * 7,
        h: 9 + Math.random() * 10,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.28,
        color: COLORS[(Math.random() * COLORS.length) | 0],
        life: 0
      });
    }
    if (!confettiRaf) confettiRaf = requestAnimationFrame(confettiTick);
  }

  function confettiTick() {
    var w = window.innerWidth;
    var h = window.innerHeight;
    ctx2d.clearRect(0, 0, w, h);
    var alive = 0;
    for (var i = 0; i < pieces.length; i++) {
      var p = pieces[i];
      p.life += 1;
      p.vy += 0.055;
      p.vx *= 0.995;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      if (p.y < h + 40 && p.life < 420) {
        alive++;
        ctx2d.save();
        ctx2d.translate(p.x, p.y);
        ctx2d.rotate(p.rot);
        ctx2d.fillStyle = p.color;
        ctx2d.globalAlpha = p.life > 320 ? Math.max(0, (420 - p.life) / 100) : 1;
        ctx2d.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx2d.restore();
      }
    }
    pieces = pieces.filter(function (p) { return p.y < h + 40 && p.life < 420; });
    if (alive > 0 && pieces.length > 0) {
      confettiRaf = requestAnimationFrame(confettiTick);
    } else {
      ctx2d.clearRect(0, 0, w, h);
      pieces = [];
      confettiRaf = 0;
    }
  }

  /* ---------- 이벤트 ---------- */
  elStart.addEventListener("click", function () { startGame(); });
  elMic.addEventListener("click", function () { startListening(); });
  elAgain.addEventListener("click", function () { playPop(); replaySpeech(); });
  elNext.addEventListener("click", function () { playPop(); goNext(); });
  elAgainGame.addEventListener("click", function () { playPop(); startGame(); });

  elSound.addEventListener("click", function () {
    state.muted = !state.muted;
    elSound.classList.toggle("off", state.muted);
    elSound.textContent = state.muted ? "🔇" : "🔊";
    elSound.setAttribute("aria-label", state.muted ? "소리 켜기" : "소리 끄기");
    if (state.muted) { stopSpeech(); }
    else { unlockAudio(); playPop(); }
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      stopSpeech();
      stopRecognition();
      stopMicMeter();
      elListening.classList.remove("on");
    }
  });

  // 첫 터치에서 오디오 잠금 해제 (아이폰 사파리 대비)
  document.addEventListener("touchstart", function once() {
    unlockAudio();
    document.removeEventListener("touchstart", once);
  }, { passive: true });

  // 서비스 워커 (PWA 오프라인)
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }

  buildProgress();
})();
</script>
</body>
</html>
